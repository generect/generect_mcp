name: Deploy MCP to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"
        type: string

jobs:
  deploy-mcp:
    runs-on: chronos
    steps:
      - name: Show current MCP container state
        run: |
          echo "=== Running containers with generect_mcp image ==="
          docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}" | grep -i mcp || echo "No mcp containers running"

      - name: Pull latest image
        run: |
          echo "Pulling ghcr.io/generect/generect_mcp:${{ inputs.image_tag }}"
          docker pull ghcr.io/generect/generect_mcp:${{ inputs.image_tag }}

      - name: Restart MCP container
        run: |
          # Find container running mcp image
          CONTAINER=$(docker ps -q --filter "ancestor=ghcr.io/generect/generect_mcp")
          if [ -z "$CONTAINER" ]; then
            echo "Trying name filter..."
            CONTAINER=$(docker ps -q --filter "name=mcp")
          fi

          if [ -z "$CONTAINER" ]; then
            echo "ERROR: Could not find running MCP container"
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"
            exit 1
          fi

          CONTAINER_NAME=$(docker inspect --format '{{.Name}}' $CONTAINER | tr -d '/')
          echo "Found container: $CONTAINER_NAME ($CONTAINER)"

          # Check if docker-compose.yml exists in mcp directory
          MCP_DIR=$(find /root /opt /home -name "docker-compose.yml" 2>/dev/null | xargs grep -l "generect_mcp" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
          if [ -n "$MCP_DIR" ]; then
            echo "Found docker-compose in $MCP_DIR"
            cd "$MCP_DIR"
            docker-compose pull
            docker-compose up -d
          else
            echo "Using docker restart..."
            docker restart "$CONTAINER"
          fi

          echo "Waiting 5s for startup..."
          sleep 5
          docker ps --filter "name=$CONTAINER_NAME" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}"

      - name: Verify security fix
        run: |
          echo "=== Testing OAuth redirect URI allowlist fix ==="
          RESPONSE=$(curl -s -X POST https://mcp.generect.com/oauth/register \
            -H "Content-Type: application/json" \
            -d '{"redirect_uris":["https://evil.com/callback"],"client_name":"test"}' \
            -w "\nHTTP_STATUS:%{http_code}" 2>&1)
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          if [ "$HTTP_CODE" = "400" ]; then
            echo "SUCCESS: Security fix active — evil.com redirect rejected with HTTP 400"
          else
            echo "FAILURE: Expected HTTP 400 but got HTTP $HTTP_CODE — fix NOT active!"
            exit 1
          fi
