name: Deploy MCP to production

# mcp.generect.com runs under pm2 as `mcp_user` on chronos. This workflow runs
# on a GitHub-hosted runner and reaches the host over SSH with a key that can do
# exactly one thing: deploy/remote-deploy.sh (forced command, see
# deploy/bootstrap-chronos.sh). It can bring the host to the tip of main and
# nothing else — no shell, no older commit, no second instance.
#
# Why not a self-hosted runner on the host: this repository is public, and a
# self-hosted runner would execute code from pull requests on a production box.
# Secrets are never passed to workflows triggered from forks, so the key cannot
# leak that way.
#
# Gated on the repository variable MCP_DEPLOY_ENABLED=true, set once the host
# has been bootstrapped — before that, a merge would only produce a red run.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.MCP_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      MCP_HOST: 65.21.69.164
      MCP_PUBLIC_URL: https://mcp.generect.com/
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set (see deploy/bootstrap-chronos.sh)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned, never learned: a changed host key must stop the deploy.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "mcp_user@${MCP_HOST}" "deploy ${SHA}" | tee deploy.out
          # remote-deploy.sh ends with: OK <sha> <version>
          read -r status deployed version < <(tail -n 1 deploy.out)
          [ "$status" = "OK" ] || { echo "::error::deploy did not report OK"; exit 1; }
          echo "sha=$deployed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify from the outside
        env:
          WANT: ${{ steps.deploy.outputs.version }}
        run: |
          for i in $(seq 1 12); do
            got=$(curl -fsS --max-time 10 "$MCP_PUBLIC_URL" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' || true)
            [ "$got" = "$WANT" ] && { echo "public endpoint serves $got"; exit 0; }
            sleep 5
          done
          echo "::error::public endpoint serves '${got:-nothing}', expected $WANT"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### MCP deploy"
            echo "- requested: \`${SHA}\`"
            echo "- deployed:  \`${{ steps.deploy.outputs.sha }}\`"
            echo "- version:   \`${{ steps.deploy.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
