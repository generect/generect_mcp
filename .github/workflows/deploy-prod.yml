name: Deploy MCP to production

# NOTE — this workflow drives the *Docker* path. Production (mcp.generect.com)
# does NOT run Docker: it runs pm2 as `mcp_user` from /home/mcp_user/generect_mcp
# on this same host (chronos), node via nvm, single instance because OAuth state
# is in memory. The hand-run pm2 procedure is in RELEASING.md — that is the live
# one. Keep this file honest rather than trusting it to deploy.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"
        type: string

jobs:
  deploy-mcp:
    runs-on: chronos
    steps:
      - name: Show current MCP container state
        run: |
          echo "=== Running containers with generect_mcp image ==="
          docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}" | grep -i mcp || echo "No mcp containers running"

      - name: Pull latest image
        run: |
          echo "Pulling ghcr.io/generect/generect_mcp:${{ inputs.image_tag }}"
          docker pull ghcr.io/generect/generect_mcp:${{ inputs.image_tag }}

      - name: Restart MCP container
        run: |
          CONTAINER=$(docker ps -q --filter "ancestor=ghcr.io/generect/generect_mcp")
          if [ -z "$CONTAINER" ]; then
            echo "Trying name filter..."
            CONTAINER=$(docker ps -q --filter "name=mcp")
          fi

          if [ -z "$CONTAINER" ]; then
            echo "ERROR: Could not find running MCP container"
            docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}"
            exit 1
          fi

          CONTAINER_NAME=$(docker inspect --format '{{.Name}}' $CONTAINER | tr -d '/')
          echo "Found container: $CONTAINER_NAME ($CONTAINER)"

          MCP_DIR=$(find /root /opt /home -name "docker-compose.yml" 2>/dev/null | xargs grep -l "generect_mcp" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
          if [ -n "$MCP_DIR" ]; then
            echo "Found docker-compose in $MCP_DIR"
            cd "$MCP_DIR"
            docker-compose pull
            docker-compose up -d
          else
            echo "Using docker restart..."
            docker restart "$CONTAINER"
          fi

          echo "Waiting 5s for startup..."
          sleep 5
          docker ps --filter "name=$CONTAINER_NAME" --format "table {{.ID}}\t{{.Names}}\t{{.Status}}"

      - name: Verify redirect policy is live
        run: |
          # The old assertion here ("evil.com must be rejected") stopped being
          # true when the redirect policy went open: any https callback
          # registers, on purpose, so that every MCP client can connect. What
          # still has to hold is checked below — a client scheme gets in, and
          # the three things that must never get in stay out.
          probe() {
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              https://mcp.generect.com/oauth/register \
              -H "Content-Type: application/json" \
              -d "{\"redirect_uris\":[\"$1\"],\"client_name\":\"verify-deploy\"}"
          }
          fail=0
          expect() {
            code=$(probe "$2")
            if [ "$code" = "$1" ]; then
              echo "ok   $2 -> $code"
            else
              echo "FAIL $2 -> $code (expected $1)"
              fail=1
            fi
          }
          # The point of the change: an editor's own URI scheme must register.
          expect 201 "cursor://anysphere.cursor-mcp/oauth/callback"
          # Browser-executable scheme — we navigate to this from our own origin.
          expect 400 "javascript:alert(1)"
          # Cleartext http to a public host dressed as a private range.
          expect 400 "http://10.evil.com/cb"
          # Embedded credentials, i.e. https://claude.ai@evil.example/cb.
          expect 400 "https://claude.ai@evil.example/cb"
          [ "$fail" = "0" ] || { echo "Redirect policy is NOT the expected one."; exit 1; }

      - name: Delete test OAuth clients
        run: |
          echo "=== Cleaning up test OAuth clients ==="
          MCP_DIR=$(find /root /opt /home -name "docker-compose.yml" 2>/dev/null | xargs grep -l "generect_mcp" 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
          if [ -n "$MCP_DIR" ]; then
            cd "$MCP_DIR"
            CONTAINER=$(docker ps -q --filter "name=mcp")
            if [ -n "$CONTAINER" ]; then
              docker exec "$CONTAINER" node -e "
                const fs = require('fs');
                const paths = ['/app/data', '/data', '/app/clients.json'];
                const toDelete = ['f58bb68c-9c92-42e4-a16d-3d9be6e03fa1', '870ddd99-532a-4bf6-8a5e-d34603377d20'];
                console.log('Checking for test client cleanup...');
                // Try to find and read clients storage
                const clientFiles = ['/app/data/clients.json', '/data/clients.json', '/app/clients.json'];
                for (const f of clientFiles) {
                  try {
                    if (fs.existsSync(f)) {
                      const data = JSON.parse(fs.readFileSync(f));
                      const before = data.length || Object.keys(data).length;
                      let cleaned = Array.isArray(data)
                        ? data.filter(c => !toDelete.includes(c.client_id))
                        : Object.fromEntries(Object.entries(data).filter(([k]) => !toDelete.includes(k)));
                      fs.writeFileSync(f, JSON.stringify(cleaned, null, 2));
                      console.log('Cleaned', f);
                      process.exit(0);
                    }
                  } catch(e) { console.log('Not found:', f, e.message); }
                }
                console.log('No persistent client storage found — clients may be in-memory and will expire');
              " 2>&1 || echo "Cleanup script run (in-memory storage is fine)"
            fi
          fi
          echo "Cleanup step done."
