name: Publish to MCP Registry

# After the npm publish, not on the server.json push: server.json lists the npm
# package, and the registry verifies it by reading `mcpName` from that exact npm
# version. Racing the npm publish failed the registry step whenever npm was
# slower. Every release bumps package.json and server.json together
# (check-version), so "npm publish finished" is the release signal for both.
on:
  workflow_dispatch: # Manual trigger
  workflow_run:
    workflows: ['Publish to npm']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # publish-npm also succeeds as a no-op when the version is already on npm
      # (a dependency bump, a workflow edit, a hand-made release). The registry
      # refuses a version it already has, so skip instead of failing six times.
      #
      # The registry API is sometimes slow or answers 5xx (on 2026-10-07 its search
      # endpoint took 2 minutes to return a 500), so only a definite answer counts:
      # 200 = skip, 404 = publish, anything else is retried and then fails loudly
      # rather than publishing blind into a version the registry may already have.
      - name: Skip a version the registry already has
        id: already
        run: |
          NAME=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          ENC=$(node -p "encodeURIComponent('$NAME')")
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null --max-time 30 -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$ENC/versions/$VERSION" || true)
            if [ "$CODE" = "200" ]; then
              echo "::notice::$NAME $VERSION is already in the registry; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$CODE" = "404" ] && exit 0
            echo "registry answered $CODE (attempt $i); retrying in 20s"
            sleep 20
          done
          echo "::error::The registry gave no definite answer for $NAME $VERSION (last: $CODE)."
          exit 1

      # Pinned. v1.0.0 requested an OIDC audience the registry stopped accepting
      # ("invalid audience: expected https://registry.modelcontextprotocol.io,
      # got [mcp-registry]"), which silently failed every run from late 2025
      # onward while the registry entry stayed on 0.1.2.
      - name: Download MCP Publisher
        if: steps.already.outputs.skip != 'true'
        env:
          PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version || true

      # We publish under the `com.generect/*` namespace, which is owned by the
      # generect.com domain. GitHub OIDC can only vouch for `io.github.generect/*`,
      # so domain auth is the only method that can publish this name.
      - name: Check domain signing key is configured
        if: steps.already.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret MCP_REGISTRY_PRIVATE_KEY is not set."
            echo "One-time setup: generate an ed25519 key and publish its public half as a TXT"
            echo "record on the APEX domain generect.com (like SPF, NOT under a _mcp-registry"
            echo "or _mcp-auth selector — the registry rejects those and says so explicitly):"
            echo "  v=MCPv1; k=ed25519; p=<base64-public-key>"
            echo "Then store the hex-encoded ed25519 seed (64 hex chars) as this secret."
            echo "Multiple MCPv1 records may coexist at the apex: the registry tries every one,"
            echo "so adding a key never invalidates an existing one."
            exit 1
          fi

      - name: Authenticate against the generect.com domain
        if: steps.already.outputs.skip != 'true'
        run: |
          ./mcp-publisher login dns \
            --domain generect.com \
            --private-key "${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}"

      # The npm CDN can serve the previous packument for a minute after a publish,
      # and the registry's ownership check reads it. Retry instead of failing.
      - name: Publish to MCP Registry
        if: steps.already.outputs.skip != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1

      # Only after a publish in this run (a skipped version was already verified by
      # the step above). Asks for this exact version, not the search endpoint (slow
      # and flaky) and not "latest" (a patch to an older line is never latest), and
      # retries while the new version propagates.
      - name: Verify the registry now serves this version
        if: steps.already.outputs.skip != 'true'
        run: |
          NAME=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          ENC=$(node -p "encodeURIComponent('$NAME')")
          GOT=none
          for i in $(seq 1 12); do
            BODY=$(curl -fsS --max-time 30 "https://registry.modelcontextprotocol.io/v0.1/servers/$ENC/versions/$VERSION" || true)
            GOT=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);console.log((d.server||d).version)}catch{console.log("none")}})')
            [ "$GOT" = "$VERSION" ] && echo "Published $NAME $VERSION" && exit 0
            echo "registry has no $VERSION yet (got $GOT, attempt $i); retrying in 20s"
            sleep 20
          done
          echo "::error::The registry does not serve $NAME $VERSION after publishing it."
          exit 1
