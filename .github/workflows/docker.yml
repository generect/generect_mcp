name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-version
      - run: npm run build
      - run: npm test
      # Ask the registry itself whether server.json would be accepted. Its limits
      # (e.g. description <= 100 chars) are only enforced at publish time, which
      # runs after the merge — too late to fix in review.
      - name: Validate server.json against the MCP Registry
        env:
          PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz
          ./mcp-publisher validate

  docker:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/generect/generect_mcp:latest
            ghcr.io/generect/generect_mcp:${{ github.sha }}


